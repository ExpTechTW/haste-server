<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <!--
      The document is zh-Hant-TW rather than zh-TW: the script subtag is the
      part that keeps a browser from offering to "translate" the page into
      Simplified Chinese for a reader who already reads Traditional.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything between these markers is rewritten per request: a paste page
      gets its own title and description so a shared link says what is behind
      it. The markers are what the server splits on; served straight from disk
      (vite dev, say) they are inert comments and the defaults below apply.
    -->
    <!--head:start-->
    <title>haste</title>
    <meta name="description" content="貼上程式碼或 log，取得一個簡短的分享連結。" />
    <meta property="og:title" content="haste" />
    <meta property="og:description" content="貼上程式碼或 log，取得一個簡短的分享連結。" />
    <meta name="twitter:title" content="haste" />
    <meta name="twitter:description" content="貼上程式碼或 log，取得一個簡短的分享連結。" />
    <!--head:end-->
    <meta name="application-name" content="haste" />
    <meta name="author" content="ExpTech Studio" />

    <!--
      Tells the browser both palettes exist, so form controls, scrollbars and the
      canvas behind the page match the theme before any CSS has parsed.
      theme-color does the same for the browser's own chrome on mobile; the two
      values are the rendered background of each theme.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!--
      Pasted logs are full of things iOS would otherwise turn into tel: links —
      ports, timestamps, IP addresses — which makes the code unreadable and
      unselectable on a phone.
    -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Link previews, for the chat windows share links actually get pasted into. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExpTech Studio" />
    <!--
      The product mark, rasterised from favicon.svg at a size the platforms will
      actually use: X wants at least 144x144 for a summary card and Facebook
      ignores anything under 200x200, so pointing this at the 32px icon would
      leave previews with no image at all.
    -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="haste" />
    <meta property="og:locale" content="zh_TW" />

    <!-- summary rather than summary_large_image: the logo is square. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="haste" />

    <!--
      The SVG carries width and height as well as a viewBox: without an
      intrinsic size some browsers refuse to rasterise it and the tab ends up
      blank. The PNG is rasterised from that same SVG for anything that cannot
      use one at all.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Resolve the theme before first paint so a dark-mode reload never
      // flashes a white page.
      ;(() => {
        try {
          const stored = localStorage.getItem("haste-theme")
          const dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
