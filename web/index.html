<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paste code and logs, get a short immutable link." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>haste</title>
    <script>
      // Resolve the theme before first paint so a dark-mode reload never
      // flashes a white page.
      ;(() => {
        try {
          const stored = localStorage.getItem("haste-theme")
          const dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
